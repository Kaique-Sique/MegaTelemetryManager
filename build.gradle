plugins {
    id 'java'
    id 'maven-publish'
}

group = 'com.github.Kaique-Sique'
version = '1.0.0'

repositories {
    mavenCentral()
    maven { url 'https://frcmaven.wpi.edu/release' }
}

dependencies {
    // ← só o ntcore, versão exata em vez de 2025.+
    implementation 'edu.wpi.first.ntcore:ntcore-java:2025.3.1'
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}